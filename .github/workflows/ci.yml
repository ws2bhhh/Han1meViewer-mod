name: CI

on:
    workflow_dispatch:

jobs:
    build:
        environment: default
        runs-on: ubuntu-latest

        steps:
            - name: Verify all secrets are set
              env:
                  KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  echo "${#KEYSTORE_BASE64}"
                  echo "${#KEYSTORE_PASSWORD}"
                  echo "${#KEY_PASSWORD}"
                  echo "${#KEY_ALIAS}"
                  echo "${#HA_GITHUB_TOKEN}"

            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: gradle

            - name: Load Dummy Google Services File
              # env:
              #     DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
              run: |
                  cat > app/google-services.json <<'EOF'
                  {
                    "project_info": {
                      "project_number": "000000000000",
                      "project_id": "dummy-project",
                      "storage_bucket": "dummy-project.appspot.com",
                      "firebase_url": "https://dummy-project-default-rtdb.firebaseio.com"
                    },
                    "client": [
                      {
                        "client_info": {
                          "mobilesdk_app_id": "1:000000000000:android:00000000000000000000000000000000",
                          "android_client_info": {
                            "package_name": "com.yenaly.han1meviewer"
                          }
                        },
                        "oauth_client": [],
                        "api_key": [
                          {
                            "current_key": "AIzaSy000000000000000000000000000000000"
                          }
                        ]
                      }
                    ],
                    "configuration_version": "1"
                  }
                  EOF

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Set up keystore for signing
              env:
                  KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  mkdir -p "$HOME/.android"
                  echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/keystore.jks"
                  magic=$(head -c 2 "$HOME/.android/keystore.jks" | xxd -p)
                  if [ "$magic" != "3082" ]; then
                    echo "::error::keystore.jks magic: $magic"
                    head -c 8 "$HOME/.android/keystore.jks" | xxd
                    exit 1
                  fi
                  echo "keystore magic OK: $(head -c 8 "$HOME/.android/keystore.jks" | xxd -p)"

            - name: Build and sign APK with Gradle
              run: ./gradlew assembleRelease
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
                  HA1_VERSION_SOURCE: "ci"

            - name: Upload APK Zip
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-${{ github.sha }}
                  path: app/build/outputs/apk/release/Han1meViewer-v*.apk
