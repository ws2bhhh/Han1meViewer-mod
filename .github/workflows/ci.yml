permissions:
    contents: read
name: CI

on:
    push:
        branches: ["main"]
        paths-ignore:
            - "**.md"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"
                  cache: gradle

            - name: Load Google Services File
              env:
                  DATA: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
              run: echo "$DATA" | base64 -di > app/google-services.json

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Set up keystore for signing
              env:
                  KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
              run: |
                  set -euo pipefail
                  if [ -z "${KEYSTORE_BASE64:-}" ]; then
                    echo "::error::Secret KEYSTORE_BASE64 is empty or not set"
                    exit 1
                  fi
                  mkdir -p "$HOME/.android"
                  echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/keystore.jks"

            - name: Build and sign APK with Gradle
              run: ./gradlew assembleRelease
              env:
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  HA_GITHUB_TOKEN: ${{ secrets.HA_GITHUB_TOKEN }}
                  HA1_VERSION_SOURCE: "ci"

            - name: Upload APK Zip
              uses: actions/upload-artifact@v4
              with:
                  name: app-release-${{ github.sha }}
                  path: app/build/outputs/apk/release/Han1meViewer-v*.apk
